# Ultralytics YOLO11 object detection model (lightweight by head reduction)
# License: AGPL-3.0
# Docs: https://docs.ultralytics.com/models/yolo11

nc: 1  # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# -------------------
# Backbone (unchanged)
# -------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 3, GAM_Attention, [1024]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

# -------------------
# Head (lightweight by removing P3 output)
# -------------------
head:
  # P4 branch
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]             # fuse with backbone P4
  - [-1, 2, C3k2, [512, False]]           # 14 (P4/16-medium)

  # P5 branch
  - [-1, 1, GSConv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]            # fuse with backbone P5
  - [-1, 2, C3k2, [1024, True]]           # 17 (P5/32-large)

  # Detect(P4, P5) only
  - [[14, 17], 1, Detect, [nc]]           # output: P4/16, P5/32
