# Ultralytics YOLO11 object detection model (lightweight by head reduction)
# License: AGPL-3.0
# Docs: https://docs.ultralytics.com/models/yolo11

nc: 1  # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
# -------------------
backbone:

  # Stem
  - [-1, 1, Conv, [64, 3, 2]]                  # 0
  - [-1, 1, Conv, [128, 3, 2]]                 # 1

  - [-1, 2, C3k2_WTConv, [256, False, 0.25]]    # 2

  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2_WTConv, [512, False, 0.25]]   # 4

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2_WTConv, [512, True]]          # 6

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2_WTConv, [1024, True]]         # 8

  # Global attention enhancement
  - [-1, 3, GAM_Attention, [1024]]             # 9
  - [-1, 1, SPPF, [1024, 5]]                  # 10
  - [-1, 2, C2PSA, [1024]]                     # 11


# -------------------
# Head
# Dual-scale detection P4 + P5
# -------------------

head:

  # -------- P5 semantic enhancement --------
  - [-1, 1, AMSF, [1024]]                      # 12 P5/32

  # -------- P4 feature fusion --------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13

  - [[-1, 6], 1, Concat, [1]]                  # 14 fuse backbone P4

  - [-1, 2, C3k2, [512, False]]                # 15 P4/16


  # -------- Detection --------
  - [[15, 12], 1, Detect, [nc]]                # P4/16 + P5/32
